name: Release binaries
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.9.15 or 1.0.0-beta.1 (optional v prefix)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node tools/prepare-release.cjs "$RELEASE_VERSION" --check
      - run: npm ci
      - run: npm run test:ci

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node tools/prepare-release.cjs "$RELEASE_VERSION"
      - run: npm run test:ci
      - name: Build and audit native binaries
        run: npm run desktop:dist -- --${{ matrix.platform }}
      - name: Prepare downloads within GitHub release size limits
        run: node tools/collect-release.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify all platform downloads and write SHA256SUMS
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node tools/verify-release.mjs release-assets "$RELEASE_VERSION"
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Britannia Survivors $RELEASE_VERSION" \
            --generate-notes "${flags[@]}"
