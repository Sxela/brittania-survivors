name: Tests and desktop staging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - name: Check local asset setup safety
        run: python -m unittest discover -s tools -p test_setup_assets.py
      - name: Install image optimization dependency
        run: python -m pip install -r requirements-assets.txt
      - name: Check lossless map optimization
        run: python -m unittest discover -s tools -p test_optimize_map_assets.py
      - name: Check seamless UI textures
        run: python -m unittest discover -s tools -p test_ui_textures.py
      - name: Stage and audit resource-free desktop runtime
        run: |
          node tools/stage-source-desktop.mjs BritanniaSurvivors-ci
          npm run desktop:audit -- dist/BritanniaSurvivors-ci
